<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Night Shift</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<noscript><p class="noscript">Lunar Night Shift needs JavaScript to run.</p></noscript>

<main id="app">

  <!-- Title -->
  <section id="screen-title" class="screen">
    <div class="panel title-card">
      <h1 id="title-name" tabindex="-1" data-t="title.name"></h1>
      <p class="tagline" data-t="title.tagline"></p>
      <ol id="title-howto" class="howto"></ol>
      <div class="button-row">
        <button id="btn-start" class="btn primary big" type="button" data-t="title.start"></button>
        <button id="btn-science" class="btn big" type="button" data-t="title.science"></button>
      </div>
    </div>
  </section>

  <!-- Level intro -->
  <section id="screen-intro" class="screen" hidden>
    <div class="panel intro-card">
      <p id="intro-level" class="chip"></p>
      <h1 id="intro-name" tabindex="-1"></h1>
      <p id="intro-text" class="intro-text"></p>
      <p id="intro-dates" class="intro-dates" hidden></p>
      <div class="button-row">
        <button id="btn-go" class="btn primary big" type="button" data-t="intro.go"></button>
      </div>
    </div>
  </section>

  <!-- The game screen. Every word is filled in from text.js by ui.js. -->
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <h1 id="hdr-level" tabindex="-1"></h1>
      <p id="hdr-turn" class="chip"></p>
      <p id="hdr-phase" class="chip phase"></p>
      <p id="hdr-dates" class="chip dates" hidden></p>
    </header>

    <div class="board">
      <div id="meters" class="panel meters"></div>
      <div class="panel picture">
        <div id="base-picture" role="img"></div>
      </div>
    </div>

    <div id="report" class="panel report" role="status" hidden></div>

    <!-- Only on turns with a real flare alert. It shows the class, the date and the dots: never the outcome. -->
    <div id="alert" class="panel alert" role="group" aria-labelledby="alert-title" hidden>
      <div class="alert-text">
        <h2 id="alert-title"></h2>
        <p id="alert-when" class="alert-when"></p>
        <p class="alert-chance"><span id="alert-dots" class="dots" role="img"></span> <span id="alert-chance"></span></p>
      </div>
      <div class="alert-choices">
        <button id="btn-shelter" class="btn choice" type="button" aria-pressed="false"></button>
        <button id="btn-stay" class="btn choice" type="button" aria-pressed="false"></button>
      </div>
    </div>

    <div class="panel controls">
      <h2 id="controls-heading" data-t="controls.heading"></h2>
      <div id="control-grid" class="control-grid"></div>
      <div class="turnbar">
        <p id="power-left" class="power-left"></p>
        <p id="message" class="message" role="status"></p>
        <button id="end-turn" class="btn primary" type="button" data-t="controls.endTurn"></button>
      </div>
    </div>
  </section>

  <!-- The debrief: after every level, win or loss. -->
  <section id="screen-debrief" class="screen" hidden>
    <div class="panel debrief">
      <h1 id="debrief-headline" tabindex="-1"></h1>
      <p id="debrief-why" class="why"></p>
      <p id="debrief-score" class="score"></p>
      <p id="debrief-tip" class="tip"></p>
      <div id="debrief-buttons" class="button-row"></div>

      <section id="debrief-storm-section" hidden>
        <h2 data-t="debrief.stormsHeading"></h2>
        <div id="debrief-storms" class="storm-cards"></div>
      </section>

      <section>
        <h2 data-t="debrief.batteryChart"></h2>
        <ol id="debrief-battery" class="chart"></ol>
        <p class="chart-note" data-t="debrief.batteryChartNote"></p>
      </section>

      <section id="debrief-moon-section" hidden>
        <h2 data-t="debrief.moonChart"></h2>
        <ol id="debrief-moon" class="chart moon"></ol>
        <p id="debrief-moon-note" class="chart-note"></p>
      </section>

      <p id="debrief-recycler" class="recycler-line" hidden></p>

      <p class="reflection">🤔 <span data-t="debrief.reflection"></span></p>
    </div>
  </section>

  <!-- Science Behind It -->
  <section id="screen-science" class="screen" hidden>
    <div class="panel science">
      <h1 id="science-heading" tabindex="-1" data-t="science.heading"></h1>
      <p data-t="science.intro"></p>
      <table id="science-table" class="science-table">
        <thead><tr><th scope="col" data-t="science.gameColumn"></th><th scope="col" data-t="science.realColumn"></th></tr></thead>
        <tbody></tbody>
      </table>
      <h2 data-t="science.datasetsHeading"></h2>
      <ul id="science-datasets" class="datasets"></ul>
      <h2 data-t="science.creditsHeading"></h2>
      <ul id="science-credits"></ul>
      <p id="science-saved" class="chart-note"></p>
      <p class="chart-note" data-t="science.disclaimer"></p>
      <div class="button-row">
        <button id="btn-science-back" class="btn big" type="button" data-t="title.back"></button>
      </div>
    </div>
  </section>

</main>

<footer class="footer"><p data-t="title.disclaimer"></p></footer>

<script src="data.js"></script>
<script src="text.js"></script>
<script src="storms.js"></script>
<script src="game.js"></script>
<script src="base.js"></script>
<script src="ui.js"></script>
</body>
</html>
